<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Directivo - Control de Branquias y Calidad de Recepción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
    .tab-active { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 700; background-color: #eff6ff; }
    .badge-a { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-b { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .badge-c { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-bof-critico { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .badge-bol-alerta { background-color: #ffedd5; color: #9a3412; border: 1px solid #fb923c; }
    .badge-boml-leve { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
  </style>
</head>
<body class="text-slate-800">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white shadow-lg border-b border-slate-700">
    <div class="max-w-[1440px] mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-blue-600 text-xs font-bold uppercase px-2.5 py-1 rounded">Control de Calidad - Recepción</span>
          <span class="text-emerald-400 text-xs font-bold" id="statusCarga">Iniciando sistema...</span>
        </div>
        <h1 class="text-xl md:text-2xl font-bold mt-1">Visión Directiva: Monitoreo de Branquias (BOML / BOL / BOF) y Clasificación</h1>
      </div>
      
      <div class="flex flex-wrap items-center gap-3">
        <label class="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 text-xs cursor-pointer hover:bg-slate-700">
          <input type="checkbox" id="chkDeduplicar" checked class="rounded text-blue-600" onchange="applyFilters()">
          <span>Deduplicar Lotes Exactos</span>
        </label>
        <label class="bg-blue-600 hover:bg-blue-500 transition text-white text-xs font-semibold px-4 py-2.5 rounded-lg cursor-pointer flex items-center gap-2 shadow">
          <span>🔄 Carga Manual (CSV)</span>
          <input type="file" id="fileInput" accept=".csv,.txt" class="hidden" onchange="handleManualUpload(event)">
        </label>
      </div>
    </div>
  </header>

  <!-- FILTROS GLOBALES -->
  <section class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
    <div class="max-w-[1440px] mx-auto px-4 py-3 grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
